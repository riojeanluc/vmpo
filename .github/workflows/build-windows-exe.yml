name: Build cleaner_app.exe

on:
  push:
    branches: ["**"]
    paths:
      - "cleaner/**"
      - "installer/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and test dependencies
        working-directory: cleaner
        run: pip install pytest pyinstaller

      - name: Run tests
        working-directory: cleaner
        run: python -m pytest

      - name: Build standalone executable
        working-directory: cleaner
        run: pyinstaller --onefile --name cleaner_app --console run_cleaner.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleaner_app-windows-exe
          path: cleaner/dist/cleaner_app.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Setup.exe)
        working-directory: installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" cleaner_app.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanerAppSetup
          path: installer/output/CleanerAppSetup.exe
